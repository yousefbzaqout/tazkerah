name: F-001 RLS Isolation (R4)

on:
  push:
    branches: [development, main, 'feature/F-001-*']
  pull_request:
    branches: [development, main]

jobs:
  tenant-rls-r4:
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          coverage: none
          tools: pint

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pint (F-001 RLS surface)
        run: ./vendor/bin/pint --test app/Support/TenantContext.php app/Models/Concerns app/Models/Event.php app/Models/Sector.php app/Models/Seat.php app/Models/Ticket.php app/Models/ScanLog.php app/Models/EventPolicyChunk.php database/migrations/2026_09_10_000001_create_tazkerah_tenant_schema.php tests/Feature/TenantRlsIsolationTest.php tests/Feature/TenantRlsAdversarialTest.php tests/Concerns/InteractsWithTenantRls.php

      - name: Run F-001 + R4 adversarial RLS suite
        env:
          APP_ENV: testing
          APP_KEY: base64:2fl+KtvkdphvQyVfipTVTxZsaOaqE/NkzN1hZU0VZK0=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
        run: |
          set -euo pipefail
          OUTPUT=$(./vendor/bin/phpunit --filter 'TenantRls(Isolation|Adversarial)Test' --testdox 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qi 'skipped' && { echo 'R4 FAIL: unexpected skipped tests'; exit 1; } || true
          echo "$OUTPUT" | grep -Eq 'OK|Tests: [1-9]' || { echo 'R4 FAIL: suite did not report OK'; exit 1; }
